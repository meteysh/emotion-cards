<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточки эмоций</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Карточки эмоций</h1>
    <div class="actions">
      <button id="btn-save" class="btn primary" type="button">Сохранить</button>
      <button id="btn-reset" class="btn" type="button">Сбросить</button>
      <button id="btn-csv" class="btn" type="button">Экспорт CSV</button>
      <button id="btn-json" class="btn ghost" type="button">Экспорт JSON</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel deck-panel" aria-labelledby="deck-title">
      <div class="panel-head">
        <h2 id="deck-title">Карточки</h2>
        <span id="deck-count" class="muted"></span>
      </div>
      <div id="deck" class="deck" data-zone="deck" role="list"></div>
    </section>

    <section class="panel board-panel" aria-labelledby="board-title">
      <div class="panel-head">
        <h2 id="board-title">Выбранные</h2>
        <span id="board-count" class="muted"></span>
      </div>
      <div id="board" class="board" data-zone="board" role="list">
        <p class="board-empty">Перетащите сюда карточки из списка слева.<br>
          Порядок можно менять перетаскиванием.</p>
      </div>
    </section>
  </main>

  <section class="panel history-panel" aria-labelledby="history-title">
    <div class="panel-head">
      <h2 id="history-title">История сохранений</h2>
      <span id="storage-info" class="muted"></span>
    </div>
    <ol id="history" class="history" reversed></ol>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/cards-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
