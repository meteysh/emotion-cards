<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Карточки эмоций</title>
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
  <div class="app">
  <header class="topbar">
    <h1>Карточки эмоций <span id="net-status" class="net-badge" hidden title="Нет подключения к интернету — всё работает и сохраняется локально">офлайн</span></h1>
    <div class="actions">
      <button id="btn-save" class="btn primary" type="button">Сохранить</button>
      <button id="btn-reset" class="btn" type="button">Сбросить</button>
      <button id="btn-csv" class="btn" type="button"><span class="long">Экспорт </span>CSV</button>
      <button id="btn-json" class="btn ghost" type="button"><span class="long">Экспорт </span>JSON</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel deck-panel" aria-labelledby="deck-title">
      <div class="panel-head">
        <h2 id="deck-title">Карточки</h2>
        <span id="deck-count" class="muted"></span>
      </div>
      <div id="deck" class="deck" data-zone="deck" role="list"></div>
    </section>

    <section class="panel board-panel" aria-labelledby="board-title">
      <div class="panel-head">
        <h2 id="board-title">Выбранные</h2>
        <span id="board-count" class="muted"></span>
      </div>
      <div id="board" class="board" data-zone="board" role="list">
        <p class="board-empty">
          <span class="hint-mouse">Перетащите сюда карточки из списка.</span>
          <span class="hint-touch">Удерживайте карточку и перетащите её сюда.</span>
          <br>Порядок можно менять перетаскиванием.</p>
      </div>
    </section>
  </main>
  </div>

  <section class="panel history-panel" aria-labelledby="history-title">
    <div class="panel-head">
      <h2 id="history-title">История сохранений</h2>
      <span id="storage-info" class="muted"></span>
    </div>
    <ol id="history" class="history" reversed></ol>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/cards-data.js?v=6"></script>
  <script src="js/db.js?v=6"></script>
  <script src="js/drag.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
